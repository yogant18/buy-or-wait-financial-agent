        function render(items) {
            const container = document.getElementById('cardsList');
            if (items.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #9ca3af;">No matching requests found.</div>';
                return;
            }
            container.innerHTML = items.map(r => `
                <div class="card">
                    <div>
                        <div class="card-top">
                            <span class="req-id">${r.request_id} (${r.user_id || ''})</span>
                            <span class="badge badge-${r.affordability_status}">${r.affordability_status.replace(/_/g, ' ')}</span>
                        </div>
                        <div class="meta-grid">
                            <span class="meta-label">Requested:</span>
                            <span class="meta-val">${Number(r.requested_amount || 0).toLocaleString()}</span>
                            <span class="meta-label">Safe to Pay:</span>
                            <span class="meta-val">${Number(r.amount_safe_to_pay || 0).toLocaleString()}</span>
                            <span class="meta-label">Recommended:</span>
                            <span class="meta-val" style="color: #60a5fa;">${r.recommended_payment_method.replace(/_/g, ' ')}</span>
                            <span class="meta-label">Earliest Safe:</span>
                            <span class="meta-val">${r.earliest_date_for_full_payment || 'N/A'}</span>
                        </div>
                        ${r.payment_plan && r.payment_plan !== 'none' ? `<div class="plan-box">📅 Plan: ${r.payment_plan}</div>` : ''}
                        <div class="explanation-box">${r.decision_explanation}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterData() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const method = document.getElementById('methodFilter').value;

            const filtered = data.filter(r => {
                const matchQ = !q || r.request_id.toLowerCase().includes(q) || (r.user_id && r.user_id.toLowerCase().includes(q)) || (r.decision_explanation && r.decision_explanation.toLowerCase().includes(q));
                const matchStatus = status === 'all' || r.affordability_status === status;
                const matchMethod = method === 'all' || r.recommended_payment_method === method;
                return matchQ && matchStatus && matchMethod;
            });

            render(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('statusFilter').addEventListener('change', filterData);
        document.getElementById('methodFilter').addEventListener('change', filterData);

        render(data);
    </script>
